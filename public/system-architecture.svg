<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Learning Platform System Architecture</title>
  <desc id="desc">Architecture showing users, React frontend, Laravel backend, PostgreSQL, Cloudflare R2, Redis, Horizon queues, Pusher, Google OAuth and GitHub OAuth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="frontend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 27px Arial, sans-serif; fill: #0f172a; letter-spacing: 1px; }
      .box-title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .label { font: 600 13px Arial, sans-serif; fill: #334155; }
      .node { fill: #fff; stroke: #94a3b8; stroke-width: 2; rx: 16; }
      .flow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .flow-both { stroke: #475569; stroke-width: 2.5; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .panel { fill: #ffffff; fill-opacity: .58; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 8 7; rx: 28; }
    </style>
  </defs>

  <rect width="1400" height="980" fill="url(#bg)"/>
  <text x="700" y="48" text-anchor="middle" class="title">HYBRID LEARNING PLATFORM</text>
  <text x="700" y="76" text-anchor="middle" class="subtitle">System Architecture</text>

  <!-- Main application boundary -->
  <rect x="260" y="105" width="880" height="665" class="panel"/>
  <text x="285" y="137" class="label">APPLICATION ENVIRONMENT</text>

  <!-- User -->
  <rect x="525" y="14" width="350" height="72" class="node" filter="url(#shadow)"/>
  <circle cx="570" cy="50" r="17" fill="#2563eb"/>
  <path d="M561 69 Q570 56 579 69" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="570" cy="45" r="6" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="615" y="43" class="box-title">USER / BROWSER</text>
  <text x="615" y="66" class="subtitle">Instructor, Student, Administrator</text>
  <path d="M700 86 L700 105" class="flow-both"/>
  <text x="715" y="100" class="small">HTTPS</text>

  <!-- Frontend -->
  <rect x="350" y="165" width="700" height="125" rx="18" fill="url(#frontend)" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="410" cy="227" r="35" fill="#2563eb"/>
  <text x="410" y="239" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#fff">R</text>
  <text x="470" y="213" class="box-title">FRONTEND CLIENT</text>
  <text x="470" y="240" class="subtitle">React + TypeScript + Vite</text>
  <text x="470" y="264" class="small">User interface, routing, forms, API requests and real-time updates</text>

  <!-- Backend -->
  <rect x="325" y="345" width="750" height="190" rx="18" fill="url(#backend)" stroke="#0d9488" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="350" y="385" width="165" height="67" class="node"/>
  <rect x="535" y="385" width="165" height="67" class="node"/>
  <rect x="720" y="385" width="165" height="67" class="node"/>
  <rect x="905" y="385" width="145" height="67" class="node"/>
  <text x="700" y="365" text-anchor="middle" class="box-title">BACKEND API SERVER</text>
  <text x="700" y="510" text-anchor="middle" class="subtitle">Laravel 12 REST API</text>
  <text x="432" y="412" text-anchor="middle" class="label">AUTHENTICATION</text>
  <text x="432" y="434" text-anchor="middle" class="small">Sanctum / OAuth</text>
  <text x="617" y="412" text-anchor="middle" class="label">BUSINESS LOGIC</text>
  <text x="617" y="434" text-anchor="middle" class="small">Controllers / Services</text>
  <text x="802" y="412" text-anchor="middle" class="label">VALIDATION</text>
  <text x="802" y="434" text-anchor="middle" class="small">Form Requests</text>
  <text x="977" y="412" text-anchor="middle" class="label">API RESPONSES</text>
  <text x="977" y="434" text-anchor="middle" class="small">JSON / Errors</text>

  <path d="M700 290 L700 345" class="flow-both"/>
  <text x="720" y="322" class="small">HTTP / JSON</text>

  <!-- Database -->
  <rect x="505" y="605" width="390" height="110" class="node" filter="url(#shadow)"/>
  <ellipse cx="555" cy="643" rx="29" ry="12" fill="#2563eb"/>
  <path d="M526 643 V684 Q555 704 584 684 V643 M526 663 Q555 683 584 663" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="620" y="647" class="box-title">DATABASE SERVER</text>
  <text x="620" y="674" class="subtitle">PostgreSQL</text>
  <path d="M700 535 L700 605" class="flow-both"/>
  <text x="715" y="575" class="small">SQL queries / results</text>

  <!-- Supporting services -->
  <rect x="285" y="820" width="220" height="108" class="node" filter="url(#shadow)"/>
  <circle cx="335" cy="861" r="22" fill="#f97316"/>
  <text x="335" y="869" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">R2</text>
  <text x="380" y="858" class="box-title">FILE STORAGE</text>
  <text x="380" y="882" class="small">Cloudflare R2</text>
  <text x="380" y="902" class="small">Videos / resources / images</text>

  <rect x="555" y="820" width="220" height="108" class="node" filter="url(#shadow)"/>
  <circle cx="605" cy="861" r="22" fill="#dc2626"/>
  <text x="605" y="869" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">R</text>
  <text x="650" y="856" style="font: 700 16px Arial, sans-serif; fill: #0f172a;">CACHE / SESSION</text>
  <text x="650" y="881" class="small">Redis</text>
  <text x="650" y="901" class="small">Cache and sessions</text>

  <rect x="825" y="820" width="270" height="108" class="node" filter="url(#shadow)"/>
  <circle cx="875" cy="861" r="22" fill="#7c3aed"/>
  <text x="875" y="869" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Q</text>
  <text x="920" y="858" class="box-title">QUEUE / JOBS</text>
  <text x="920" y="882" class="small">Redis Queue + Horizon</text>
  <text x="920" y="902" class="small">Background processing</text>

  <path d="M505 660 L395 660 L395 820" class="flow"/>
  <path d="M700 715 L700 820" class="flow-both"/>
  <path d="M895 660 L960 660 L960 820" class="flow"/>
  <text x="410" y="648" class="small">Upload / URL</text>
  <text x="715" y="760" class="small">Cache</text>
  <text x="910" y="648" class="small">Jobs</text>

  <!-- External providers -->
  <rect x="25" y="250" width="205" height="115" class="node" filter="url(#shadow)"/>
  <circle cx="78" cy="296" r="22" fill="#fff" stroke="#4285f4" stroke-width="5"/>
  <text x="78" y="303" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#4285f4">G</text>
  <text x="115" y="294" class="box-title">GOOGLE OAUTH</text>
  <text x="115" y="319" class="small">External auth provider</text>
  <path d="M230 305 L325 390" class="flow-both"/>
  <text x="252" y="258" class="small">OAuth</text>

  <rect x="25" y="425" width="205" height="115" class="node" filter="url(#shadow)"/>
  <circle cx="78" cy="471" r="22" fill="#111827"/>
  <text x="78" y="479" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">GH</text>
  <text x="115" y="469" class="box-title">GITHUB OAUTH</text>
  <text x="115" y="494" class="small">External auth provider</text>
  <path d="M230 480 L325 450" class="flow-both"/>
  <text x="252" y="428" class="small">OAuth</text>

  <rect x="1170" y="275" width="205" height="125" class="node" filter="url(#shadow)"/>
  <circle cx="1220" cy="325" r="22" fill="#0ea5e9"/>
  <path d="M1207 325 Q1220 310 1233 325 Q1220 340 1207 325" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1260" y="321" class="box-title">PUSHER</text>
  <text x="1260" y="346" class="small">WebSockets</text>
  <text x="1260" y="367" class="small">Real-time notifications</text>
  <path d="M1050 245 L1170 320" class="flow-both"/>
  <text x="1080" y="257" class="small">Events</text>
</svg>
